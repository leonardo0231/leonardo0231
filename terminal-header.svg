<svg width="1000" height="300" viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jalil Ahmad Afshar terminal profile</title>
  <desc id="desc">An animated terminal window introducing Jalil as a Python developer and machine learning researcher.</desc>
  <style>
    .mono { font: 22px 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    .small { font: 16px 'Fira Code', 'Cascadia Code', Consolas, monospace; }
    .green { fill: #7ee787; }
    .cyan { fill: #79c0ff; }
    .muted { fill: #8b949e; }
    .white { fill: #f0f6fc; }
  </style>
  <defs>
    <clipPath id="line1"><rect x="72" y="84" width="0" height="28"><animate attributeName="width" values="0;720;720;0" keyTimes="0;0.42;0.78;1" dur="8s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line2"><rect x="72" y="126" width="0" height="28"><animate attributeName="width" values="0;650;650;0" keyTimes="0;0.42;0.78;1" dur="8s" begin="0.7s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line3"><rect x="72" y="168" width="0" height="28"><animate attributeName="width" values="0;760;760;0" keyTimes="0;0.42;0.78;1" dur="8s" begin="1.4s" repeatCount="indefinite"/></rect></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="10" y="10" width="980" height="280" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="10" y="10" width="980" height="42" rx="18" fill="#161b22"/>
  <path d="M10 52H990" stroke="#30363d"/>
  <circle cx="38" cy="31" r="7" fill="#ff7b72"/>
  <circle cx="62" cy="31" r="7" fill="#d29922"/>
  <circle cx="86" cy="31" r="7" fill="#7ee787"/>
  <text x="118" y="36" class="small muted">jalil@github: ~/profile</text>

  <g clip-path="url(#line1)" filter="url(#glow)">
    <text x="72" y="106" class="mono green">jalil@github:~$ python profile.py</text>
  </g>
  <g clip-path="url(#line2)">
    <text x="72" y="148" class="mono cyan">role: Python Developer · ML Researcher</text>
  </g>
  <g clip-path="url(#line3)">
    <text x="72" y="190" class="mono white">focus: research · platforms · practical tools</text>
  </g>

  <text x="72" y="244" class="small muted">status: building useful, measurable software</text>
  <rect x="72" y="258" width="11" height="22" rx="2" fill="#7ee787">
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>

